<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Book Studio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Book navigation"></aside>
    <div class="scrim" data-act="closeSidebar" aria-hidden="true"></div>
    <main id="main" class="main" tabindex="-1">
      <div class="boot" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>Opening your library…</span>
      </div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/export.js"></script>
  <script src="js/views/sidebar.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/outline.js"></script>
  <script src="js/views/chapter.js"></script>
  <script src="js/views/editor.js"></script>
  <script src="js/views/notes.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/review.js"></script>
  <script src="js/views/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
